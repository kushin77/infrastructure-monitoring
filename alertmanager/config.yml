# ElevatedIQ AlertManager Configuration
global:
  smtp_smarthost: "smtp.gmail.com:587"
  smtp_from: "alerts@elevatediq.ai"
  resolve_timeout: 5m

inhibit_rules:
  - source_match:
      severity: "critical"
    target_match:
      severity: "warning"
    equal: ["alertname", "service"]

route:
  receiver: "default-receiver"
  group_by: ["alertname", "severity", "service"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - match:
        severity: "critical"
      receiver: "critical-alerts"
      group_wait: 10s
      repeat_interval: 1h
    - match_re:
        service: "^(postgres|mongodb|redis)$"
      receiver: "database-alerts"
    - match:
        alertname: "Watchdog"
      receiver: "null-receiver"

receivers:
  - name: "default-receiver"
    webhook_configs:
      - url: "http://localhost:9999/webhook"
        send_resolved: true

  - name: "critical-alerts"
    webhook_configs:
      - url: "http://localhost:9999/critical"
        send_resolved: true

  - name: "database-alerts"
    webhook_configs:
      - url: "http://localhost:9999/database"
        send_resolved: true

  - name: "null-receiver"
