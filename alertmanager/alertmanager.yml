global:
  resolve_timeout: 5m
  # slack_api_url: '${SLACK_WEBHOOK_URL}'  # Disabled until configured

route:
  receiver: 'default'
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 12h

  routes:
    # Critical alerts - immediate escalation
    - match:
        severity: critical
      receiver: 'critical-escalation'
      group_wait: 0s
      repeat_interval: 5m

    # Warning alerts - batched
    - match:
        severity: warning
      receiver: 'warning-team'
      group_wait: 1m
      repeat_interval: 1h

    # Infrastructure alerts
    - match:
        severity: critical
        component: 'infrastructure'
      receiver: 'sre-oncall'
      group_wait: 0s
      repeat_interval: 5m

    # Security alerts
    - match:
        severity: warning
        component: 'security-agent'
      receiver: 'security-team'
      group_wait: 0s
      repeat_interval: 1h

    # Business SLA alerts
    - match_re:
        alertname: 'SLA.*'
      receiver: 'product-team'
      group_wait: 5m
      repeat_interval: 30m

# Inhibition rules prevent notifications for certain alerts
inhibit_rules:
  # Suppress warning alerts if service is already down (critical)
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'service']

  # Suppress error rate warnings if service is down
  - source_match:
      alertname: 'ServiceDown'
    target_match:
      alertname: 'ServiceHighErrorRate'
    equal: ['service']

receivers:
  - name: 'default'
    # Default receiver - logs to alertmanager UI only

  - name: 'critical-escalation'
    # Critical alerts - configure webhook or email when ready

  - name: 'warning-team'
    # Warning alerts - configure webhook or email when ready

  - name: 'sre-oncall'
    # SRE alerts - configure webhook or email when ready

  - name: 'security-team'
    # Security alerts - configure webhook or email when ready

  - name: 'product-team'
    # Product alerts - configure webhook or email when ready
