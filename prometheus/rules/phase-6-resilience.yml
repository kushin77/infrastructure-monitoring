groups:
  - name: phase-6-resilience
    interval: 30s
    rules:
      # Circuit Breaker metrics
      - alert: CircuitBreakerOpen
        expr: circuit_breaker_state{service=~"aiops|finops"} == 1
        for: 1m
        labels:
          severity: critical
          phase: "6"
        annotations:
          summary: "Circuit breaker OPEN for {{ $labels.service }}"
          description: "Service {{ $labels.service }} circuit breaker has been open for >1m. Upstream is likely unhealthy."
          runbook: "docs/runbooks/CIRCUIT_BREAKER_RECOVERY.md"

      - alert: CircuitBreakerTripRate
        expr: rate(circuit_breaker_trips_total[5m]) > 0.5
        for: 5m
        labels:
          severity: warning
          phase: "6"
        annotations:
          summary: "High circuit breaker trip rate for {{ $labels.service }}"
          description: "{{ $labels.service }} experiencing frequent failures (>0.5 trips/sec over 5m)."

      # Gateway API resilience
      - alert: GatewayAIOpsErrorRate
        expr: rate(elevatediq_gateway_errors_total{path=~"/api/v1/scale|/api/v1/optimize"}[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
          phase: "6"
        annotations:
          summary: "High error rate on Gateway AIOps/FinOps proxying"
          description: "AIOps/FinOps upstream error rate >10% over 5m. Check circuit breaker state and upstream health."

      - alert: GatewayHighLatency
        expr: histogram_quantile(0.95, rate(elevatediq_gateway_request_duration_seconds_bucket[5m])) > 5
        for: 5m
        labels:
          severity: warning
          phase: "6"
        annotations:
          summary: "Gateway API p95 latency >5s"
          description: "Upstream services responding slowly. Check database, cache, and circuit breaker states."

      # Backup metrics
      - alert: BackupMissing
        expr: (time() - elevatediq_last_backup_timestamp_seconds) > 86400
        for: 1m
        labels:
          severity: critical
          phase: "6"
        annotations:
          summary: "No backup in last 24 hours"
          description: "Backup pipeline may have failed. Check backup logs and restore readiness."

      - alert: BackupIncomplete
        expr: elevatediq_backup_status_complete == 0
        for: 10m
        labels:
          severity: warning
          phase: "6"
        annotations:
          summary: "Backup incomplete for >10m"
          description: "Backup operation in progress for too long. Check resource utilization and logs."

      # SLO metrics
      - alert: SLOErrorBudgetExhausted
        expr: (1 - (sum(rate(elevatediq_requests_total{status=~"2.."}[30d])) / sum(rate(elevatediq_requests_total[30d])))) > 0.01
        for: 5m
        labels:
          severity: critical
          phase: "6"
        annotations:
          summary: "Error budget exhausted (SLO breach)"
          description: "30-day error rate >1% (SLO breach). Escalate to incident commander."

      - alert: SLOLatencyBreach
        expr: histogram_quantile(0.99, rate(elevatediq_request_duration_seconds_bucket[30d])) > 2
        for: 5m
        labels:
          severity: warning
          phase: "6"
        annotations:
          summary: "30-day p99 latency exceeds SLO"
          description: "p99 latency >2s over 30d. Review slow queries and optimize critical paths."
