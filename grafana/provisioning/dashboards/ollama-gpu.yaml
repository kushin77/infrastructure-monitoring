apiVersion: 1

providers:
  - name: 'Ollama GPU & Throughput'
    orgId: 1
    folder: 'Services'
    type: file
    disableDeletion: false
    editable: true
    options:
      path: /etc/grafana/provisioning/dashboards

dashboards:
