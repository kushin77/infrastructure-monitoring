apiVersion: 1

# Datasource provisioning configuration
datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    password: ''
    user: ''
    database: ''
    basicAuth: false
    isDefault: true
    jsonData:
      timeInterval: '30s'
    editable: true

  - name: Prometheus-Long-Term
    type: prometheus
    access: proxy
    url: http://prometheus-long-term:9090
    password: ''
    user: ''
    database: ''
    basicAuth: false
    jsonData:
      timeInterval: '5m'
    editable: true

  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    password: ''
    user: ''
    database: ''
    basicAuth: false
    isDefault: false
    jsonData:
      maxLines: 1000
    editable: true

  - name: Jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
    password: ''
    user: ''
    database: ''
    basicAuth: false
    isDefault: false
    jsonData:
      timeout: '30'
    editable: true
